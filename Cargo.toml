[workspace]
members = [
    "crates/rvsim-core",
    "crates/rvsim-bindings"
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Will McCallion"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/willmccallion/rvsim"
homepage = "https://github.com/willmccallion/rvsim"
description = "A cycle-level RISC-V 64-bit system simulator."
readme = "README.md"
categories = ["emulators", "hardware-support", "science"]
keywords = ["riscv", "simulator", "microarchitecture", "cpu-architecture"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
pyo3 = { version = "0.23.5" }
libc = "0.2"
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
thiserror = "2"

# Panics unwind so that a panic inside the Python extension surfaces as a
# `PanicException` instead of aborting the interpreter.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
incremental   = false

[profile.profiling]
inherits      = "release"
debug         = 1              # Line tables for perf/flamegraph
strip         = "none"         # Keep symbols for profiling

[profile.debug-opt]
inherits      = "release"
debug         = 2              # Full debug info (symbols + line tables + types)
strip         = "none"         # Keep everything for backtraces

# Dev builds at opt-level 1: the simulator is unusable at opt-level 0.
# Full debug info and fast incremental compiles are preserved.
[profile.dev]
opt-level = 1

# Optimize dependencies even in dev — serde/pyo3 don't need debug codegen.
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "deny"
# A type the public API hands out must be one callers can name.
unnameable_types = "deny"
# unsafe_code is permitted for the RAM image (a lazily zeroed allocation
# viewed as a byte slice) and for FFI into the C floating-point environment
# (feclearexcept/fetestexcept). Every unsafe block carries a SAFETY comment.
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Strong baseline
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Strictness on panics/WIP code
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Every unsafe block names the invariant it relies on, one operation at a time.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Style/naming allows: standard for simulators and hardware code
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
unreadable_literal = "allow"      # RV64 masks like 0xFFFF_FFFF_0000_0000
many_single_char_names = "allow"  # PTE fields: r, w, x, u, d are RISC-V spec names
inline_always = "allow"           # Hot-path annotations are intentional

bool_to_int_with_if = "allow"     # (cond) as u64 is idiomatic for flag extraction

# as *const / *mut casts between raw pointer types are idiomatic in unsafe memory code.
ptr_as_ptr = "allow"

[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
