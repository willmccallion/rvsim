name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Rust comes from rust-toolchain.toml and ruff from requirements-dev.txt,
# the same pins the nix dev shell and `make python` use.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check rvsim tests examples tools docs
      - run: ruff check rvsim tests examples tools docs
      - run: make python
      - run: make test-python

  # riscv-tests, the RVV sample against spike and the multi-hart programs
  # (`make conformance-smoke`), built with the flake's pinned cross toolchain.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      # What these are built from is pinned in tests/conformance/sources.mk;
      # the toolchain comes from flake.lock.
      - uses: actions/cache@v4
        with:
          path: |
            tests/builds/spike-install
            tests/builds/riscv-tests
            tests/builds/riscv-vector-tests
            tests/builds/vector-smoke
          key: conformance-${{ hashFiles('tests/conformance/sources.mk', 'flake.lock', 'tests/conformance/vector/build_tests.sh') }}
      - name: Fetch the dev shell
        run: nix develop --command true
      - name: Build the bindings, guest programs and test binaries
        run: nix develop --command make python software riscv-tests-build vector-smoke-build
      - name: Conformance smoke
        run: nix develop --command make conformance-smoke
