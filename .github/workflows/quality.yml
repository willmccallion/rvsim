name: Quality

# How well the tests check the code. On a pull request, every mutant
# cargo-mutants makes in the Rust the PR changed must fail a test
# (`make mutants-diff`), split four ways to fit the runners; a PR that
# changes no Rust has none. Coverage is reported, not gated
# (`make test-coverage`).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants ${{ matrix.shard }}/4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: make mutants-diff MUTANTS_BASE=origin/${{ github.base_ref }} MUTANTS_SHARD=${{ matrix.shard }}/4
      - name: Keep the mutants' outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.shard }}
          path: target/mutants.out
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: make test-coverage | tee coverage.txt
        shell: bash
      - name: Summarise
        run: |
          {
            echo '### Coverage per file'
            echo '```'
            sed -n '/^Filename/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/lcov.info
