[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rvsim"
# maturin takes the version from the workspace Cargo.toml.
dynamic = ["version"]
description = "Cycle-level RISC-V system simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13"]
license = { text = "MIT OR Apache-2.0" }
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Emulators",
    "Intended Audience :: Science/Research",
]

[project.scripts]
rvsim = "rvsim.__main__:main"

[tool.maturin]
manifest-path = "crates/rvsim-bindings/Cargo.toml"
features = ["extension", "commit-log"]
module-name = "rvsim._core"
include = ["LICENSE-APACHE", "LICENSE-MIT"]

[tool.ruff]
extend-exclude = ["tests/builds", "third_party", "docs/spec", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "BLE", "C4", "N", "PERF",
    "ARG", "PIE", "RET",
]
ignore = [
    "E501",  # ruff format owns line length; what it leaves long is a string
    "N818",  # KernelPanic and Stalled name what happened, not an error type
]
# The stats tables' title marker and the docs' "N×" multipliers.
allowed-confusables = ["›", "×"]

[tool.ruff.lint.per-file-ignores]
# The runners record any worker failure as that test's error and carry on,
# and each script puts the repository on sys.path before importing from it.
"tests/conformance/**" = ["BLE001", "E402"]
"tools/**" = ["E402"]

[tool.mypy]
files = ["rvsim"]
python_version = "3.10"
strict = true
